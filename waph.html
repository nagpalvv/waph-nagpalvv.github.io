<!-- Technical Requirements Section -->
<section class="resume-section" id="technical">
    <div class="resume-section-content">
        <h2 class="mb-5">Technical Requirements</h2>
        
        <div id="welcome-message" class="alert alert-info mb-4"></div>

        <div class="row">
            <!-- Clocks -->
            <div class="col-md-6">
                <h3 class="mb-3">Clocks</h3>
                <div id="digit-clock" style="font-size: 1.5rem; font-weight: bold; margin-bottom: 10px;"></div>
                <canvas id="analog-clock" width="150" height="150" style="background:#eee;"></canvas>
            </div>

            <!-- API Integrations -->
            <div class="col-md-6">
                <h3 class="mb-3">API Integrations</h3>
                
                <div class="mb-4">
                    <strong>Joke API (JokeAPI):</strong>
                    <p id="joke-container" style="font-style: italic;">Loading joke...</p>
                </div>

                <div class="mb-4">
                    <strong>Graphic API (Dog CEO):</strong><br>
                    <img id="graphic-api" src="" alt="Random Dog" style="width: 200px; margin-top:10px;">
                </div>
                
                <p><small><em>Disclaimer: Content generated by third-party APIs (JokeAPI/Dog.ceo). I am not responsible for the content.</em></small></p>
            </div>
        </div>
    </div>
</section>

<!-- Required JS Logic -->
<script src="https://waph-phung.github.io/clock.js"></script>
<script>
    // 1. Digital Clock
    function updateDigitClock() {
        document.getElementById('digit-clock').innerHTML = "Digital Clock: " + new Date().toLocaleTimeString();
    }
    setInterval(updateDigitClock, 1000);
    updateDigitClock(); // Initial call

    // 2. Analog Clock (Referencing WAPH course lab resources)
    var canvas = document.getElementById("analog-clock");
    var ctx = canvas.getContext("2d");
    var radius = 75; 
    ctx.translate(radius, radius);
    radius = radius * 0.90;
    setInterval(() => {
        drawFace(ctx, radius);
        drawNumbers(ctx, radius);
        drawTime(ctx, radius);
    }, 1000);

    // 3. API Integrations
    $(document).ready(function() {
        // Joke API
        function fetchJoke() {
            $.get("https://v2.jokeapi.dev/joke/Any?blacklistFlags=nsfw,religious,political,racist,sexist,explicit&type=single", 
            (res) => { if(!res.error) $("#joke-container").text(res.joke); });
        }
        fetchJoke(); setInterval(fetchJoke, 60000);

        // Dog API
        $.get("https://dog.ceo/api/breeds/image/random", (res) => $("#graphic-api").attr("src", res.message));
    });
</script>
