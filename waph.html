<script>
    // 1. Digital Clock
    function updateDigitClock() {
        document.getElementById('digit-clock').innerHTML = "Digital Clock: " + new Date().toLocaleTimeString();
    }
    setInterval(updateDigitClock, 1000);
    updateDigitClock();

    // 2. API Integrations
    $(document).ready(function() {
        console.log("jQuery is loaded: " + (typeof jQuery !== 'undefined'));

        // Joke API
        function fetchJoke() {
            $.ajax({
                url: "https://v2.jokeapi.dev/joke/Any?blacklistFlags=nsfw,religious,political,racist,sexist,explicit&type=single",
                method: "GET",
                success: function(res) {
                    console.log("Joke received:", res);
                    $("#joke-container").text(res.joke);
                },
                error: function(err) {
                    console.error("Joke API Error:", err);
                    $("#joke-container").text("Failed to load joke.");
                }
            });
        }
        fetchJoke();
        setInterval(fetchJoke, 60000);

        // Dog API
        $.ajax({
            url: "https://dog.ceo/api/breeds/image/random",
            method: "GET",
            success: function(res) {
                console.log("Dog image received:", res);
                $("#graphic-api").attr("src", res.message);
            },
            error: function(err) {
                console.error("Dog API Error:", err);
            }
        });
    });
</script>
