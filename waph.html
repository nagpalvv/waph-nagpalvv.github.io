<hr>
<section id="technical">
    <h2>Technical Requirements</h2>
    <div id="welcome-message" class="alert alert-info"></div>
    <div class="row">
        <div class="col-md-6">
            <h3>Clocks</h3>
            <div id="digit-clock"></div>
            <canvas id="analog-clock" width="150" height="150"></canvas>
        </div>
        <div class="col-md-6">
            <h3>API Integrations</h3>
            <div id="joke-container">Loading joke...</div>
            <img id="graphic-api" src="" alt="API Graphic" style="width: 200px;">
            <p><small>Disclaimer: Content generated by third-party APIs (JokeAPI/Dog.ceo). I am not responsible for the content.</small></p>
        </div>
    </div>
</section>

<!-- Required JS Logic -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://waph-phung.github.io/clock.js"></script>
<script>
    // 1. Cookies
    function setCookie(n,v,d){ var date = new Date(); date.setTime(date.getTime()+(d*24*60*60*1000)); document.cookie = n+"="+v+"; expires="+date.toUTCString()+"; path=/"; }
    function getCookie(n){ var name = n + "="; var ca = document.cookie.split(';'); for(var i=0; i<ca.length; i++){ var c=ca[i].trim(); if(c.indexOf(name)==0) return c.substring(name.length); } return ""; }
    
    let lastVisit = getCookie("lastVisit");
    if(lastVisit == "") $("#welcome-message").text("Welcome to my homepage for the first time!");
    else $("#welcome-message").text("Welcome back! Your last visit was " + lastVisit);
    setCookie("lastVisit", new Date().toLocaleString(), 365);

    // 2. Clocks
    setInterval(() => $("#digit-clock").text(new Date().toLocaleTimeString()), 1000);
    // (Ensure canvas draw functions are called here as per Lab 2)

    // 3. Joke API
    function loadJoke() {
        $.get("https://v2.jokeapi.dev/joke/Any?blacklistFlags=nsfw,religious,political,racist,sexist,explicit&type=single", 
        (res) => { if(!res.error) $("#joke-container").text(res.joke); });
    }
    loadJoke(); setInterval(loadJoke, 60000);

    // 4. Graphic API
    $.get("https://dog.ceo/api/breeds/image/random", (res) => $("#graphic-api").attr("src", res.message));
</script>
